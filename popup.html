<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px; margin: 0; padding: 16px;
      font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f3efe6; color: #1b1a17;
    }
    .status { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #3a7d44; }
    .dot.off { background: #a8a29a; }
    p { margin: 6px 0 0; color: #6e695f; }
    button {
      margin-top: 14px; width: 100%; padding: 8px; border: 1px solid #1b1a17; border-radius: 6px;
      background: #1b1a17; color: #f3efe6; font: inherit; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="status"><span class="dot" id="dot"></span><span id="state"></span></div>
  <p id="detail"></p>
  <p id="count"></p>
  <button id="settings">Edit sites &amp; schedule</button>
  <script type="module" src="popup.js"></script>
</body>
</html>
