<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Focus Redirect — Settings</title>
  <link rel="icon" href="icons/48.png">
  <style>
    :root { --bg: #f3efe6; --ink: #1b1a17; --muted: #6e695f; --line: #d9d3c5; --field: #fbf9f4; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151412; --ink: #ece7dc; --muted: #8d877b; --line: #2c2a26; --field: #1d1c19; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 48px 24px; background: var(--bg); color: var(--ink);
      font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      accent-color: var(--ink);
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font: 400 40px/1.1 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; margin: 0 0 32px; }
    section { border-top: 1px solid var(--line); padding: 24px 0; }
    h2 { font-size: 15px; margin: 0 0 4px; }
    .hint { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
    textarea, input[type=url], input[type=time] {
      width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px;
      background: var(--field); color: var(--ink); font: 14px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
    }
    textarea { min-height: 170px; resize: vertical; }
    input[type=time] { width: auto; }
    label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .days { display: flex; flex-wrap: wrap; gap: 14px; margin: 12px 0; }
    .row { display: flex; align-items: center; gap: 10px; }
    #schedule-fields[disabled] { opacity: .45; }
    fieldset { border: 0; padding: 0; margin: 0; }
    .actions { display: flex; align-items: center; gap: 14px; border-top: 1px solid var(--line); padding-top: 24px; }
    button {
      padding: 9px 20px; border: 0; border-radius: 6px; background: var(--ink); color: var(--bg);
      font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer;
    }
    #msg { color: var(--muted); font-size: 14px; }
    #msg.err { color: #b3261e; }
  </style>
</head>
<body>
  <main>
    <h1>Focus Redirect</h1>

    <section>
      <h2>Blocked sites</h2>
      <p class="hint">One per line. Subdomains are included, so <code>facebook.com</code> also blocks <code>m.facebook.com</code>.</p>
      <textarea id="sites" spellcheck="false"></textarea>
    </section>

    <section>
      <h2>Send me to</h2>
      <p class="hint">Leave empty for the built-in "Not now." page, which has the 1-minute grace button. A custom URL has no grace.</p>
      <input type="url" id="redirect" placeholder="https://www.khanacademy.org">
    </section>

    <section>
      <h2>Schedule</h2>
      <label><input type="checkbox" id="sched-on"> Only block during set hours</label>
      <p class="hint" style="margin-top:6px">When off, sites are blocked all the time.</p>
      <fieldset id="schedule-fields">
        <div class="days" id="days"></div>
        <div class="row">
          <input type="time" id="start"> <span>to</span> <input type="time" id="end">
        </div>
      </fieldset>
    </section>

    <div class="actions">
      <button id="save">Save</button>
      <span id="msg"></span>
    </div>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
